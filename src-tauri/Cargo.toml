[package]
name = "companionframe"
version = "0.2.0"
description = "A free, open-source desktop companion for Warframe."
authors = ["CompanionFrame contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "companionframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
unicode-normalization = "0.1"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["time", "rt-multi-thread", "sync", "macros", "process"] }
url = "2.5.8"
percent-encoding = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
lzma-rs = "0.3"
tauri-plugin-single-instance = "2"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
rusqlite = { version = "0.41.0", features = ["bundled"] }
specta = "=2.0.0-rc.26"
specta-typescript = "0.0.13"
tauri-specta = { version = "2.0.0-rc.26", features = ["derive", "typescript"] }
notify = "8.2.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
tauri-plugin-dialog = "2"
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "hound"] }
tauri-plugin-notification = "2.7.0"
base64 = "0.23"
flate2 = "1"
tauri-plugin-global-shortcut = "2"
# load-dynamic: onnxruntime.dll ships as a resource and is loaded by absolute path (see services/ocr_onnx).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
# riven card text repair needs lookahead, which `regex` lacks.
fancy-regex = "0.14"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


# Line tables keep backtraces readable; dependency debug info is what filled the disk.
[profile.dev]
debug = "line-tables-only"
# Our own scan preprocessing dominates a riven read: ~3.6 s at opt 0, ~0.9 s at opt 1.
opt-level = 1

[profile.dev.package."*"]
debug = false
# Dependencies (image, ort, ...) optimized in `pnpm tauri dev`: a compare read took ~6 s unoptimized.
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
# replay example: the user's captures are JPEGs.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
