name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      has_pat: ${{ steps.pat.outputs.has_pat }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      - id: pat
        run: echo "has_pat=${{ secrets.RELEASE_PLEASE_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # A PAT makes the release PR run ci-ok and pr-title (GITHUB_TOKEN events trigger no workflows).
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # With a PAT the new tag already triggers release.yml; with GITHUB_TOKEN it cannot, so call it here.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.has_pat != 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write

  # release-please cannot update Cargo.lock (its toml updater only edits plain tables), so refresh the workspace entries here.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr_branch != '' && needs.release-please.outputs.has_pat == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          # The PAT (not GITHUB_TOKEN) makes the push re-run ci-ok and pr-title on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Update the workspace entries in Cargo.lock
        working-directory: src-tauri
        run: cargo update --workspace

      - name: Commit if only the version changed
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already up to date."
            exit 0
          fi
          # Only the companionframe version line may change; anything else means a dependency moved.
          changed=$(git diff -U0 -- src-tauri/Cargo.lock | grep -E '^[-+][^-+]' || true)
          if [ "$(echo "$changed" | wc -l)" -ne 2 ] || echo "$changed" | grep -Evq '^[-+]version = '; then
            echo "::error::cargo update changed more than the workspace version:"
            git diff -- src-tauri/Cargo.lock
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(main): update cargo.lock for the release" -- src-tauri/Cargo.lock
          git push
