name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      has_pat: ${{ steps.pat.outputs.has_pat }}
    steps:
      - id: pat
        run: echo "has_pat=${{ secrets.RELEASE_PLEASE_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # A PAT makes the release PR run ci-ok and pr-title (GITHUB_TOKEN events trigger no workflows).
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # With a PAT the new tag already triggers release.yml; with GITHUB_TOKEN it cannot, so call it here.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.has_pat != 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
