name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          libdbus-1-dev libasound2-dev libssl-dev libxdo-dev patchelf build-essential curl

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      # Linux runtime arrives with F7-T4b; the tests that need it are cfg(windows) until then.
      - if: runner.os == 'Windows'
        run: pnpm fetch-onnx
      - run: pnpm build
      - run: pnpm test

      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - working-directory: src-tauri
        run: cargo test

      - run: pnpm bindings
      - run: git diff --exit-code src/bindings.ts
