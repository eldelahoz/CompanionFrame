name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

# Windows only: overlays, capture and OCR do not exist on Linux yet, so a Linux package would be a stripped app.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Read version and changelog section
        id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if { [ -n "${INPUT_TAG}" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; } && [ "${TAG}" != "v${ver}" ]; then
            echo "::error::Tag ${TAG} does not match version ${ver} in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          notes=$(awk -v v="$ver" '/^## \[?[0-9]+\.[0-9]+\.[0-9]+/{p=(index($0,"## "v" ")==1||index($0,"## ["v"]")==1); next} p' CHANGELOG.md)
          # release-please writes "## X.Y.Z (date)"; the manual fallback writes "## [X.Y.Z] - date". Both end at the next version heading.
          [ -n "$notes" ] || notes="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
          {
            echo "body<<CF_EOF"
            echo "$notes"
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)"
            echo "CF_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      # Both are idempotent; tauri's beforeBuildCommand runs them again as a no-op.
      - run: pnpm game-data
      - run: pnpm fetch-onnx

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: CompanionFrame v__VERSION__
          releaseBody: ${{ steps.meta.outputs.body }}
          releaseDraft: true
          prerelease: false
