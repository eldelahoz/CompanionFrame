version: 2
updates:
  # One weekly PR that bumps every GitHub Action; its title "chore(deps): ..." passes the PR title check.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [chore, dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
